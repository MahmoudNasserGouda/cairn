name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default (ADR-0021). Jobs opt into more where needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.13.0'

jobs:
  verify:
    name: Lint · Types · Tests · CSP guard
    runs-on: ubuntu-latest
    steps:
      # Renovate (helpers:pinGitHubActionDigests) pins these tags to SHAs on the first update PR.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run guard:csp
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build (web · extension · libs)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run build:web
      - run: npm run build:extension
      - name: Bundle-origin guard (strict)
        run: node scripts/check-bundle-origins.mjs --strict
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7
      - name: Upload extension build
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: apps/extension/dist/
          retention-days: 7

  dependency-scan:
    name: Dependencies (OSV · audit · licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high/critical fail)
        run: npm audit --audit-level=high
      - name: OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          args: '--lockfile=package-lock.json --format=table'
      - name: License allowlist
        run: node scripts/check-licenses.mjs

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Required since gitleaks-action v2's breaking change: needed to enumerate
          # PR commits. The automatically-provided token is sufficient (read-only).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [verify, build, dependency-scan, secret-scan]
    steps:
      - run: echo "All required checks passed."
