name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22.13.0'

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run build:web
      - run: node scripts/check-bundle-origins.mjs --strict
      - run: npm run build:extension
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

  deploy-cloudflare:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://opensourcecompass.pages.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=opensourcecompass

  deploy-pages:
    name: GitHub Pages (mirror)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  publish-extension:
    name: Extension artifact (manual store gate)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: extension-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:extension
      - name: Package
        run: |
          cd apps/extension/dist
          zip -r ../../../extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: extension.zip
          retention-days: 90
      # Store upload is intentionally NOT automated — a maintainer approves the
      # `extension-store` environment and submits the artifact (ADR-0022).
