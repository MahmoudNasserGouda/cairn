name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22.13.0'

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run build:web
      - run: node scripts/check-bundle-origins.mjs --strict
      - run: npm run build:extension
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

  deploy-cloudflare:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://cairn.mahmoudnasser98.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

  deploy-auth-worker:
    name: Cloudflare Workers (auth token-exchange)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://cairn-auth.mahmoudnasser98.workers.dev/
    steps:
      - uses: actions/checkout@v4
      # <PROVIDER>_CLIENT_SECRET values are set once out-of-band via
      # `wrangler secret put` and persist across deploys. Only the public client IDs
      # are injected here, from repo variables (empty ⇒ that provider stays disabled).
      - name: Deploy cairn-auth
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api/optional-serverless/oauth
          command: >-
            deploy
            --var GITHUB_CLIENT_ID:${{ vars.OAUTH_GITHUB_CLIENT_ID }}
            --var LINKEDIN_CLIENT_ID:${{ vars.OAUTH_LINKEDIN_CLIENT_ID }}
            --var GOOGLE_CLIENT_ID:${{ vars.OAUTH_GOOGLE_CLIENT_ID }}

  publish-extension:
    name: Extension artifact (manual store gate)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: extension-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:extension
      - name: Package
        run: |
          cd apps/extension/dist
          zip -r ../../../extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: extension.zip
          retention-days: 90
      # Store upload is intentionally NOT automated — a maintainer approves the
      # `extension-store` environment and submits the artifact (ADR-0022).
