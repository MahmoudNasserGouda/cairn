<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rujoom OCR sandbox</title>
    <!--
      The sandbox's own policy (ADR-0028).

      In production this arrives as a response header from `apps/web/public/_headers`
      on the `/ocr/*` path, which is what keeps it out of the application's `/*` policy.
      It is repeated here as a `<meta>` so the guarantee survives being opened directly
      and so a local dev server — which does not apply `_headers` — still enforces it.

      `'wasm-unsafe-eval'` is the whole reason this document exists. It is the one
      capability the application origin must never have, because that origin holds the
      GitHub token and the BYOK key. Here there is nothing to steal: this document is
      embedded with `sandbox="allow-scripts"` and no `allow-same-origin`, so it runs on
      an opaque origin with no access to the app's storage.

      `connect-src 'self'` — not `'none'`, which is where the spike first went wrong.
      The engine has to load its own model files, and a header and a `<meta>` policy are
      *both* enforced, so a stricter meta silently overrode the header and blocked the
      fetch. `'self'` is the narrowest value that still works: its own assets, nothing
      else. There is no outbound origin here at all.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; img-src blob: data:; style-src 'unsafe-inline'; connect-src 'self'"
    />
  </head>
  <body>
    <script src="sandbox.js"></script>
  </body>
</html>
