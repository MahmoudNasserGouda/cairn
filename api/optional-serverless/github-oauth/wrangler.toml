# Stateless GitHub OAuth token-exchange Worker (ADR-0024).
#
# One-time setup (owner, local):
#   cd api/optional-serverless/github-oauth
#   wrangler secret put GITHUB_CLIENT_SECRET      # paste the OAuth App client secret
#
# GITHUB_CLIENT_ID is public and injected at deploy time from the GitHub Actions
# repository variable GITHUB_OAUTH_CLIENT_ID (see .github/workflows/deploy.yml).
# For a local deploy: wrangler deploy --var GITHUB_CLIENT_ID:<id>
name = "cairn-auth"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://cairn.mahmoudnasser98.workers.dev"
GITHUB_CLIENT_ID = "set-at-deploy-time"
